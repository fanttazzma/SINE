/*
 * Paleta institucional (Guía de Identidad Gráfica 2024-2030):
 *   negro #161a1d · gris #98989A · guinda #9b2247/#611232
 *   verde #1e5b4f/#002f2a · dorado #a57f2c/#e6d194
 * Auxiliares derivados: verde hoja #4a7c3a, azul pizarra #2f5d7c,
 * ciruela #5b3a5e, terracota #b8643a.
 *
 * Los valores *-rgb e --ink/--surface se redefinen en superficies oscuras
 * (.on-dark, .stage) para que los mismos rgba() funcionen en ambos contextos.
 */
:root {
  color-scheme: light;
  --guinda: #9b2247;
  --guinda-dk: #611232;
  --verde: #1e5b4f;
  --verde-dk: #002f2a;
  --dorado: #a57f2c;
  --dorado-lt: #e6d194;
  --negro: #161a1d;
  --gris: #98989a;

  --ink: 22, 26, 29;
  --surface: 255, 255, 255;
  --shade: 22, 26, 29;
  --cyan-rgb: 30, 91, 79;
  --lime-rgb: 74, 124, 58;
  --amber-rgb: 138, 106, 36; /* dorado oscurecido para texto AA sobre blanco */
  --pink-rgb: 155, 34, 71;
  --violet-rgb: 91, 58, 94;

  --bg: #fbf9f4;
  --bg-2: #f4efe2;
  --panel: rgba(var(--surface), 0.9);
  --panel-strong: rgba(var(--surface), 0.96);
  --panel-solid: #ffffff;
  --line: rgba(var(--ink), 0.11);
  --line-strong: rgba(var(--ink), 0.22);
  --text: #161a1d;
  --muted: #4d4d4d;
  --dim: #646468;
  --on-accent: #ffffff;
  --cyan: rgb(var(--cyan-rgb));
  --violet: rgb(var(--violet-rgb));
  --pink: rgb(var(--pink-rgb));
  --amber: rgb(var(--amber-rgb));
  --lime: rgb(var(--lime-rgb));
  --blue: #2f5d7c;
  --green: #1e5b4f;
  --radius: 26px;
  --radius-sm: 16px;
  --shadow: 0 18px 44px rgba(var(--shade), 0.09);
  --font-body: 'Noto Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-display: 'Patria', Georgia, 'Times New Roman', serif;
  --max: 1220px;
}

/* Superficie oscura institucional ("pizarrón" verde): escenarios y medallones. */
.on-dark,
.stage {
  color-scheme: dark;
  --ink: 255, 255, 255;
  --surface: 0, 47, 42;
  --shade: 0, 0, 0;
  --cyan-rgb: 230, 209, 148;
  --lime-rgb: 159, 211, 184;
  --amber-rgb: 230, 190, 110;
  --pink-rgb: 236, 150, 175;
  --violet-rgb: 205, 175, 210;
  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.78);
  --dim: rgba(255, 255, 255, 0.62);
  --line: rgba(255, 255, 255, 0.12);
  --line-strong: rgba(255, 255, 255, 0.24);
  --on-accent: #002f2a;
  --cyan: rgb(var(--cyan-rgb));
  --violet: rgb(var(--violet-rgb));
  --pink: rgb(var(--pink-rgb));
  --amber: rgb(var(--amber-rgb));
  --lime: rgb(var(--lime-rgb));
  color: var(--text);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(ellipse 80% 60% at 15% -10%, rgba(230, 209, 148, 0.45), transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 5%, rgba(30, 91, 79, 0.08), transparent 55%),
    radial-gradient(ellipse 70% 60% at 50% 110%, rgba(155, 34, 71, 0.06), transparent 60%),
    linear-gradient(180deg, #fbf9f4 0%, #ffffff 45%, #fbf9f4 100%);
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

#stars {
  position: fixed;
  inset: 0;
  z-index: -2;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0.55;
}

.aurora {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  overflow: hidden;
}

.aurora span {
  position: absolute;
  width: 46vw;
  height: 46vw;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.12;
  animation: drift 22s ease-in-out infinite alternate;
}

.aurora span:nth-child(1) {
  top: -18%;
  left: -8%;
  background: #e6d194;
}

.aurora span:nth-child(2) {
  top: 10%;
  right: -16%;
  background: #1e5b4f;
  animation-delay: -7s;
}

.aurora span:nth-child(3) {
  bottom: -24%;
  left: 30%;
  background: #9b2247;
  animation-delay: -13s;
}

::selection {
  background: rgba(230, 209, 148, 0.7);
  color: var(--negro);
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
}

img,
svg {
  display: block;
  max-width: 100%;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

ul {
  margin: 0;
  padding: 0;
  list-style: none;
}

:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 4px;
}

.skip-link {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  padding: 10px 16px;
  border-radius: 12px;
  background: var(--verde);
  color: #fff;
  transform: translateY(-160%);
  transition: transform 0.2s ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.wrap {
  width: min(var(--max), calc(100% - 40px));
  margin: 0 auto;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Navigation ---------- */

.nav {
  position: sticky;
  top: 14px;
  z-index: 50;
  width: min(var(--max), calc(100% - 28px));
  margin: 14px auto 0;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 12px 10px 16px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(var(--surface), 0.82);
  box-shadow: 0 18px 50px rgba(var(--shade), 0.136);
  backdrop-filter: blur(22px) saturate(140%);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

/* Logo SINE: se respeta el área de protección (padding) y nunca se deforma. */
.brand__logo {
  display: block;
  height: 44px;
  width: auto;
  padding: 2px 4px;
}

.footer__logo {
  display: block;
  height: 40px;
  width: auto;
}

.brand__mark {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, rgba(var(--cyan-rgb), 0.2), rgba(var(--violet-rgb), 0.32));
  border: 1px solid rgba(var(--cyan-rgb), 0.32);
  box-shadow: 0 0 26px rgba(var(--cyan-rgb), 0.18);
}

.brand__mark svg {
  width: 22px;
  height: 22px;
}

.brand__name {
  font-family: var(--font-display);
  font-size: 1.16rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.brand__tag {
  display: block;
  font-family: var(--font-body);
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-top: 1px;
}

.nav__links {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 6px;
}

.nav__link {
  padding: 9px 13px;
  border-radius: 12px;
  font-size: 0.86rem;
  font-weight: 500;
  color: var(--muted);
  transition: color 0.2s ease, background 0.2s ease;
}

.nav__link:hover,
.nav__link.is-active {
  color: var(--text);
  background: rgba(var(--ink), 0.06);
}

.nav__spacer {
  flex: 1;
}

.nav__right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(var(--ink), 0.04);
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 600;
  white-space: nowrap;
}

.chip__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 10px var(--lime);
}

.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(var(--ink), 0.04);
  color: var(--muted);
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.icon-btn:hover {
  color: var(--text);
  background: rgba(var(--ink), 0.08);
  border-color: var(--line-strong);
}

.icon-btn svg {
  width: 18px;
  height: 18px;
}

.avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(var(--cyan-rgb), 0.35);
  background: linear-gradient(145deg, rgba(var(--cyan-rgb), 0.18), rgba(var(--violet-rgb), 0.32));
  color: var(--text);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}

/* ---------- Buttons ---------- */

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px 20px;
  border: 1px solid transparent;
  border-radius: 14px;
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  overflow: hidden;
}

.btn svg {
  width: 17px;
  height: 17px;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn--primary {
  color: var(--on-accent);
  background: linear-gradient(120deg, var(--cyan) 0%, color-mix(in srgb, var(--cyan) 78%, var(--verde-dk)) 100%);
  box-shadow: 0 10px 32px rgba(var(--cyan-rgb), 0.22);
}

.btn--primary:hover {
  box-shadow: 0 14px 42px rgba(var(--cyan-rgb), 0.32);
}

.btn--violet {
  color: #fff;
  background: linear-gradient(120deg, var(--guinda), var(--guinda-dk));
  box-shadow: 0 10px 34px rgba(155, 34, 71, 0.22);
}

.btn--ghost {
  color: var(--text);
  background: rgba(var(--ink), 0.045);
  border-color: var(--line);
}

.btn--ghost:hover {
  background: rgba(var(--ink), 0.08);
  border-color: var(--line-strong);
}

.btn--danger {
  color: #fff;
  background: linear-gradient(120deg, var(--guinda), var(--guinda-dk));
  box-shadow: 0 10px 30px rgba(var(--pink-rgb), 0.24);
}

.btn--small {
  padding: 9px 13px;
  border-radius: 11px;
  font-size: 0.78rem;
}

.btn:disabled {
  opacity: 0.42;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--cyan);
}

.link-arrow svg {
  width: 16px;
  height: 16px;
  transition: transform 0.2s ease;
}

.link-arrow:hover svg {
  transform: translateX(4px);
}

/* ---------- Layout / common ---------- */

.main {
  padding: 54px 0 90px;
}

.section {
  margin-top: 76px;
}

.section__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 26px;
}

.section__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--cyan);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.section__eyebrow::before {
  content: '';
  width: 22px;
  height: 1px;
  background: currentColor;
  opacity: 0.7;
}

.section__title {
  font-family: var(--font-display);
  font-size: clamp(1.55rem, 2.4vw, 2.25rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
}

.section__sub {
  max-width: 560px;
  margin-top: 9px;
  color: var(--muted);
  font-size: 0.94rem;
  line-height: 1.6;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(var(--ink), 0.04);
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 600;
}

.pill--live {
  color: var(--lime);
  border-color: rgba(var(--lime-rgb), 0.22);
  background: rgba(var(--lime-rgb), 0.06);
}

.pill--live .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 10px var(--lime);
  animation: pulse 1.8s ease-in-out infinite;
}

.card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.footer {
  margin-top: 90px;
  padding: 34px 0 40px;
  border-top: 1px solid var(--line);
  color: var(--dim);
  font-size: 0.78rem;
}

.footer__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.footer__brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  color: var(--muted);
}

.footer__brand svg {
  width: 20px;
  height: 20px;
}

.footer__note {
  max-width: 520px;
  line-height: 1.55;
  text-align: right;
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 200;
  transform: translate(-50%, 140%);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: min(92vw, 460px);
  padding: 12px 16px;
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: rgba(var(--surface), 0.94);
  box-shadow: 0 20px 60px rgba(var(--shade), 0.2);
  color: var(--text);
  font-size: 0.84rem;
  transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.2, 1);
  backdrop-filter: blur(18px);
}

.toast.is-visible {
  transform: translate(-50%, 0);
}

.toast svg {
  width: 18px;
  height: 18px;
  color: var(--cyan);
  flex-shrink: 0;
}

/* ---------- Modal ---------- */

.modal {
  position: fixed;
  inset: 0;
  z-index: 150;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(22, 26, 29, 0.42);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  backdrop-filter: blur(8px);
}

.modal.is-open {
  opacity: 1;
  visibility: visible;
}

.modal__card {
  width: min(520px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 24px;
  border: 1px solid var(--line-strong);
  border-radius: 24px;
  background: var(--panel-solid);
  box-shadow: 0 40px 100px rgba(var(--shade), 0.24);
  transform: translateY(12px) scale(0.98);
  transition: transform 0.25s ease;
}

.modal.is-open .modal__card {
  transform: translateY(0) scale(1);
}

.modal__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.modal__title {
  font-family: var(--font-display);
  font-size: 1.2rem;
  letter-spacing: -0.01em;
}

.modal__text {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.65;
}

.field {
  display: grid;
  gap: 7px;
  margin-top: 14px;
}

.field label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--muted);
}

.field input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: rgba(var(--ink), 0.04);
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
}

.modal__actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}

/* ---------- Animations ---------- */

@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(4%, 6%, 0) scale(1.08); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.8); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-18px) rotate(1.5deg); }
}

@keyframes spin-slow {
  to { transform: rotate(360deg); }
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pop {
  0% { transform: scale(0.8); opacity: 0; }
  70% { transform: scale(1.04); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes shimmer {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(220%); }
}

.view-enter {
  animation: fade-up 0.55s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.001ms !important;
  }
}

/* ---------- Responsive base ---------- */

@media (max-width: 860px) {
  .nav {
    top: 8px;
    width: calc(100% - 18px);
    margin-top: 8px;
    padding: 8px 8px 8px 12px;
    gap: 10px;
  }

  .nav__links {
    display: none;
  }

  .brand__tag {
    display: none;
  }

  .chip--grade {
    display: none;
  }

  .main {
    padding-top: 36px;
  }

  .wrap {
    width: min(var(--max), calc(100% - 24px));
  }

  .section {
    margin-top: 54px;
  }

  .section__head {
    align-items: flex-start;
    flex-direction: column;
  }

  .footer__note {
    text-align: left;
  }
}

@media (max-width: 520px) {
  .brand__name {
    font-size: 1rem;
  }

  .brand__logo {
    height: 34px;
    padding: 2px 0;
  }
}

@media (max-width: 400px) {
  .brand__logo {
    height: 28px;
  }

  .nav__right {
    gap: 5px;
  }

  .icon-btn,
  .avatar {
    width: 34px;
    height: 34px;
  }

  .btn {
    padding: 12px 16px;
    font-size: 0.86rem;
  }
}

.install-steps {
  display: grid;
  gap: 9px;
  margin-top: 14px;
}

.install-steps div {
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(var(--ink), 0.025);
}

.install-steps b {
  font-size: 0.74rem;
  color: var(--text);
}

.install-steps span {
  font-size: 0.72rem;
  line-height: 1.5;
  color: var(--muted);
}


/* ---------- Hero ---------- */

.hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
  align-items: center;
  gap: 40px;
  min-height: 560px;
  padding: 34px 0 10px;
}

.hero__kicker {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 7px 12px 7px 8px;
  border: 1px solid rgba(var(--cyan-rgb), 0.22);
  border-radius: 999px;
  background: rgba(var(--cyan-rgb), 0.055);
  color: var(--cyan);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-bottom: 22px;
}

.hero__kicker b {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(var(--cyan-rgb), 0.14);
  color: var(--cyan);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.hero__title {
  font-family: var(--font-display);
  font-size: clamp(2.7rem, 5.4vw, 5rem);
  line-height: 0.96;
  letter-spacing: -0.01em;
  font-weight: 700;
  max-width: 760px;
}

.grad-text {
  background: linear-gradient(100deg, var(--guinda) 0%, var(--guinda) 45%, var(--dorado) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero__lead {
  max-width: 540px;
  margin-top: 22px;
  color: var(--muted);
  font-size: clamp(0.98rem, 1.2vw, 1.08rem);
  line-height: 1.7;
}

.hero__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 28px;
}

.hero__stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-top: 38px;
  max-width: 560px;
}

.stat {
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: rgba(var(--ink), 0.03);
}

.stat__num {
  font-family: var(--font-display);
  font-size: 1.32rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.stat__label {
  margin-top: 3px;
  color: var(--dim);
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Orb / mascot */

.hero__visual {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 480px;
}

.orb {
  position: relative;
  width: min(420px, 36vw);
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 35% 30%, rgba(230, 209, 148, 0.22), transparent 42%),
    radial-gradient(circle at 65% 70%, rgba(155, 34, 71, 0.35), transparent 50%),
    linear-gradient(160deg, #1e5b4f, #002f2a 70%);
  border: 1px solid rgba(165, 127, 44, 0.45);
  box-shadow:
    inset 0 0 80px rgba(0, 0, 0, 0.25),
    0 30px 80px rgba(0, 47, 42, 0.22);
}

.orb::before,
.orb::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(var(--ink), 0.09);
  pointer-events: none;
}

.orb::before {
  inset: -28px;
  border-color: rgba(165, 127, 44, 0.45);
  border-style: dashed;
  animation: spin-slow 48s linear infinite;
}

.orb::after {
  inset: 34px;
  border-color: rgba(230, 209, 148, 0.18);
}

.orb__glow {
  position: absolute;
  inset: 18%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(230, 209, 148, 0.2), transparent 68%);
  filter: blur(18px);
  animation: pulse 5s ease-in-out infinite;
}

.orb__mascot {
  position: relative;
  z-index: 2;
  width: 56%;
  animation: float-slow 7s ease-in-out infinite;
  filter: drop-shadow(0 18px 40px rgba(230, 209, 148, 0.25));
}

.orb__mascot svg {
  width: 100%;
  height: auto;
}

.orbit-chip {
  position: absolute;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border: 1px solid rgba(var(--ink), 0.14);
  border-radius: 13px;
  background: rgba(var(--surface), 0.86);
  box-shadow: 0 16px 40px rgba(var(--shade), 0.152);
  color: var(--text);
  font-size: 0.72rem;
  font-weight: 600;
  backdrop-filter: blur(14px);
  animation: float 6s ease-in-out infinite;
}

.orbit-chip svg {
  width: 16px;
  height: 16px;
}

.orbit-chip--1 { top: 10%; left: -2%; animation-delay: -1s; }
.orbit-chip--2 { top: 24%; right: -4%; animation-delay: -2.6s; }
.orbit-chip--3 { bottom: 18%; left: -4%; animation-delay: -4.1s; }
.orbit-chip--4 { bottom: 8%; right: 2%; animation-delay: -5.2s; }

.orb__ring {
  position: absolute;
  inset: 8%;
  border-radius: 50%;
  border: 1px solid rgba(var(--ink), 0.06);
}

.orb__ring:nth-child(2) {
  inset: 0;
  border-color: rgba(var(--violet-rgb), 0.08);
}

/* ---------- Grades ---------- */

.grades {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.grade-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 288px;
  padding: 24px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(120% 110% at 100% 0%, color-mix(in srgb, var(--c1) 20%, transparent), transparent 55%),
    linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  box-shadow: var(--shadow);
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  transform-style: preserve-3d;
}

.grade-card::before {
  content: '';
  position: absolute;
  inset: -40% -20% auto;
  height: 65%;
  background: radial-gradient(ellipse at center, color-mix(in srgb, var(--c1) 28%, transparent), transparent 68%);
  opacity: 0.6;
  pointer-events: none;
}

.grade-card::after {
  content: '';
  position: absolute;
  right: -30px;
  bottom: -40px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--c1) 25%, transparent);
  opacity: 0.5;
}

.grade-card:hover {
  border-color: color-mix(in srgb, var(--c1) 45%, transparent);
  box-shadow: 0 24px 60px rgba(var(--shade), 0.12), 0 0 0 1px color-mix(in srgb, var(--c1) 20%, transparent);
}

.grade-card__top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.grade-card__num {
  font-family: var(--font-display);
  font-size: clamp(3.2rem, 5vw, 4.4rem);
  line-height: 0.85;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: color-mix(in srgb, var(--c1) 82%, var(--negro));
}

.grade-card__num span {
  font-size: 0.3em;
  letter-spacing: 0;
  color: var(--c1);
  vertical-align: top;
  margin-left: 3px;
}

.grade-card__tag {
  display: inline-flex;
  padding: 6px 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c1) 30%, transparent);
  background: color-mix(in srgb, var(--c1) 9%, transparent);
  color: var(--c1);
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
}

.grade-card__body {
  position: relative;
  z-index: 1;
  margin-top: auto;
  padding-top: 50px;
}

.grade-card__name {
  font-family: var(--font-display);
  font-size: 1.3rem;
  letter-spacing: -0.01em;
}

.grade-card__desc {
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.55;
}

.grade-card__bottom {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.grade-card__meta {
  color: var(--dim);
  font-size: 0.7rem;
  font-weight: 600;
}

.grade-card__go {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--c1) 28%, transparent);
  background: color-mix(in srgb, var(--c1) 10%, transparent);
  color: var(--c1);
  transition: transform 0.2s ease, background 0.2s ease;
}

.grade-card:hover .grade-card__go {
  transform: translateX(4px);
  background: color-mix(in srgb, var(--c1) 20%, transparent);
}

.grade-card__go svg {
  width: 16px;
  height: 16px;
}

/* ---------- Featured / lesson cards ---------- */

.featured {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.mini-lesson {
  position: relative;
  overflow: hidden;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.mini-lesson:hover {
  transform: translateY(-4px);
  border-color: var(--line-strong);
}

.mini-lesson__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}

.mini-lesson__icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent);
}

.mini-lesson__icon svg {
  width: 21px;
  height: 21px;
}

.mini-lesson__subject {
  color: var(--muted);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.mini-lesson__title {
  font-family: var(--font-display);
  font-size: 1.08rem;
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin-top: 12px;
}

.mini-lesson__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  color: var(--dim);
  font-size: 0.7rem;
}

.mini-lesson__meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.mini-lesson__meta svg {
  width: 13px;
  height: 13px;
}

/* ---------- Features ---------- */

.features {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.feature {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(var(--ink), 0.025);
}

.feature__icon {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: rgba(var(--cyan-rgb), 0.08);
  border: 1px solid rgba(var(--cyan-rgb), 0.16);
  color: var(--cyan);
  margin-bottom: 13px;
}

.feature__icon svg {
  width: 18px;
  height: 18px;
}

.feature__title {
  font-size: 0.86rem;
  font-weight: 600;
}

.feature__text {
  margin-top: 5px;
  color: var(--dim);
  font-size: 0.74rem;
  line-height: 1.5;
}

/* ---------- Grade page ---------- */

.crumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dim);
  font-size: 0.76rem;
  margin-bottom: 22px;
}

.crumbs a:hover {
  color: var(--text);
}

.crumbs svg {
  width: 13px;
  height: 13px;
  opacity: 0.6;
}

.grade-hero {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 30px;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 30px;
  overflow: hidden;
  background:
    radial-gradient(120% 120% at 100% 0%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 55%),
    linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  box-shadow: var(--shadow);
}

.grade-hero::after {
  content: attr(data-big);
  position: absolute;
  right: 22px;
  bottom: -42px;
  font-family: var(--font-display);
  font-size: 12rem;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.1em;
  color: rgba(var(--ink), 0.035);
  pointer-events: none;
}

.grade-hero__label {
  color: var(--c1);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.grade-hero__title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3.3rem);
  line-height: 0.98;
  letter-spacing: -0.01em;
}

.grade-hero__desc {
  max-width: 560px;
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.65;
}

.progress-ring {
  --value: 0;
  --size: 96px;
  width: var(--size);
  height: var(--size);
  position: relative;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background:
    radial-gradient(circle at center, var(--panel-solid) 58%, transparent 59%),
    conic-gradient(var(--c1) calc(var(--value) * 1%), rgba(var(--ink), 0.08) 0);
  border: 1px solid var(--line);
  flex-shrink: 0;
}

.progress-ring__text {
  text-align: center;
  position: relative;
  z-index: 1;
}

.progress-ring__num {
  font-family: var(--font-display);
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.progress-ring__label {
  color: var(--dim);
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 24px;
}

.subject-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 210px;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background:
    linear-gradient(160deg, color-mix(in srgb, var(--c1) 8%, transparent), transparent 45%),
    linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  transition: transform 0.22s ease, border-color 0.22s ease;
  overflow: hidden;
}

.subject-card:hover {
  transform: translateY(-4px);
  border-color: color-mix(in srgb, var(--c1) 40%, transparent);
}

.subject-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.subject-card__icon {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  color: #fff;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent);
  box-shadow: 0 10px 26px color-mix(in srgb, var(--c1) 14%, transparent);
}

.subject-card__icon svg {
  width: 24px;
  height: 24px;
}

.subject-card__count {
  color: var(--dim);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.subject-card__title {
  font-family: var(--font-display);
  font-size: 1.22rem;
  letter-spacing: -0.01em;
  margin-top: 18px;
}

.subject-card__desc {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1.5;
}

.subject-card__bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: auto;
  padding-top: 16px;
}

.bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(var(--ink), 0.08);
  overflow: hidden;
  flex: 1;
}

.bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--c1), var(--c2));
  width: 0;
  transition: width 0.8s cubic-bezier(0.2, 0.9, 0.2, 1);
}

.subject-card__pct {
  color: var(--dim);
  font-size: 0.66rem;
  font-weight: 600;
  min-width: 32px;
  text-align: right;
}

/* ---------- Subject page ---------- */

.subject-hero {
  position: relative;
  padding: 34px;
  border: 1px solid var(--line);
  border-radius: 30px;
  overflow: hidden;
  background:
    radial-gradient(100% 120% at 0% 0%, color-mix(in srgb, var(--c1) 18%, transparent), transparent 55%),
    linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  box-shadow: var(--shadow);
}

.subject-hero__icon {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  background: linear-gradient(145deg, var(--c1), var(--c2));
  color: #fff;
  margin-bottom: 20px;
}

.subject-hero__icon svg {
  width: 28px;
  height: 28px;
}

.subject-hero__title {
  font-family: var(--font-display);
  font-size: clamp(2rem, 4vw, 3.1rem);
  letter-spacing: -0.01em;
  line-height: 1;
}

.subject-hero__desc {
  max-width: 640px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.65;
}

.lesson-list {
  display: grid;
  gap: 12px;
  margin-top: 24px;
}

.lesson-row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(var(--ink), 0.025);
  transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.lesson-row:hover {
  transform: translateX(4px);
  border-color: color-mix(in srgb, var(--c1) 35%, transparent);
  background: rgba(var(--ink), 0.04);
}

.lesson-row__num {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  border: 1px solid color-mix(in srgb, var(--c1) 22%, transparent);
  background: color-mix(in srgb, var(--c1) 8%, transparent);
  color: var(--c1);
  font-family: var(--font-display);
  font-size: 0.82rem;
  font-weight: 700;
}

.lesson-row__main {
  flex: 1;
  min-width: 0;
}

.lesson-row__title {
  font-size: 0.92rem;
  font-weight: 600;
}

.lesson-row__sub {
  margin-top: 3px;
  color: var(--dim);
  font-size: 0.74rem;
}

.lesson-row__meta {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  color: var(--dim);
  font-size: 0.7rem;
}

.lesson-row__meta span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.lesson-row__meta svg {
  width: 13px;
  height: 13px;
}

.lesson-row__status {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--dim);
  flex-shrink: 0;
}

.lesson-row__status svg {
  width: 14px;
  height: 14px;
}

.lesson-row__status.is-done {
  color: var(--on-accent);
  background: var(--lime);
  border-color: var(--lime);
}

/* ---------- Notebook ---------- */

.profile-card {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 22px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 28px;
  overflow: hidden;
  background:
    radial-gradient(90% 140% at 0% 0%, rgba(var(--cyan-rgb), 0.12), transparent 55%),
    radial-gradient(90% 140% at 100% 100%, rgba(var(--violet-rgb), 0.14), transparent 55%),
    linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  box-shadow: var(--shadow);
}

.profile-card__avatar {
  width: 84px;
  height: 84px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid rgba(var(--cyan-rgb), 0.35);
  background: linear-gradient(145deg, rgba(var(--cyan-rgb), 0.2), rgba(var(--violet-rgb), 0.32));
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
}

.profile-card__name {
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  letter-spacing: -0.01em;
}

.profile-card__sub {
  margin-top: 5px;
  color: var(--muted);
  font-size: 0.82rem;
}

.profile-stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.profile-stat {
  min-width: 82px;
  padding: 12px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(var(--ink), 0.03);
}

.profile-stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: -0.01em;
}

.profile-stat span {
  display: block;
  margin-top: 2px;
  color: var(--dim);
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.notebook-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 18px;
  margin-top: 20px;
}

.panel {
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(var(--ink), 0.025);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.panel__title {
  font-family: var(--font-display);
  font-size: 1.08rem;
  letter-spacing: -0.01em;
}

.progress-list {
  display: grid;
  gap: 13px;
}

.progress-item {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 11px;
}

.progress-item__icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: color-mix(in srgb, var(--c1) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--c1) 20%, transparent);
  color: var(--c1);
}

.progress-item__icon svg {
  width: 16px;
  height: 16px;
}

.progress-item__name {
  font-size: 0.78rem;
  font-weight: 600;
}

.progress-item__bar {
  margin-top: 5px;
  height: 5px;
  border-radius: 999px;
  background: rgba(var(--ink), 0.08);
  overflow: hidden;
}

.progress-item__bar span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--c1), var(--c2));
}

.progress-item__pct {
  color: var(--dim);
  font-size: 0.66rem;
  font-weight: 600;
}

.badges {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.badge-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(var(--ink), 0.025);
  opacity: 0.45;
}

.badge-card.is-unlocked {
  opacity: 1;
  border-color: rgba(var(--lime-rgb), 0.22);
  background: rgba(var(--lime-rgb), 0.045);
}

.badge-card__icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(var(--ink), 0.05);
  font-size: 1rem;
}

.badge-card.is-unlocked .badge-card__icon {
  background: rgba(var(--lime-rgb), 0.12);
}

.badge-card__name {
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1.2;
}

.badge-card__desc {
  margin-top: 2px;
  color: var(--dim);
  font-size: 0.62rem;
}

.empty {
  padding: 28px;
  text-align: center;
  color: var(--dim);
  font-size: 0.84rem;
}

.notebook-actions {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

/* ---------- Responsive app ---------- */

@media (max-width: 1060px) {
  .hero {
    grid-template-columns: 1fr;
    min-height: 0;
    padding-top: 20px;
  }

  .hero__visual {
    min-height: 380px;
    order: -1;
  }

  .orb {
    width: min(340px, 62vw);
  }

  .hero__stats {
    max-width: 100%;
  }

  .features {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .notebook-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 860px) {
  .grades,
  .featured {
    grid-template-columns: 1fr;
  }

  .grade-card {
    min-height: 220px;
  }

  .grade-card__body {
    padding-top: 34px;
  }

  .subjects {
    grid-template-columns: 1fr;
  }

  .grade-hero {
    grid-template-columns: 1fr;
    padding: 24px;
  }

  .grade-hero::after {
    font-size: 8rem;
    bottom: -20px;
  }

  .progress-ring {
    --size: 78px;
  }

  .subject-hero {
    padding: 24px;
  }

  .lesson-row {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .lesson-row__meta {
    width: 100%;
    padding-left: 54px;
  }

  .profile-card {
    grid-template-columns: 1fr;
    text-align: left;
  }

  .profile-stats {
    justify-content: flex-start;
  }

  .hero__stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .badges {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 520px) {
  .hero__title {
    font-size: clamp(2.4rem, 12vw, 3.2rem);
  }

  .hero__visual {
    min-height: 300px;
  }

  .orb {
    width: min(280px, 74vw);
  }

  .orbit-chip {
    font-size: 0.62rem;
    padding: 7px 9px;
  }

  .orbit-chip--1 { left: -6%; }
  .orbit-chip--2 { right: -6%; }
  .orbit-chip--3 { left: -6%; }
  .orbit-chip--4 { right: -4%; }

  .features {
    grid-template-columns: 1fr;
  }

  .lesson-row__meta {
    padding-left: 0;
    flex-wrap: wrap;
    gap: 8px;
  }
}

/* ---------- Mobile bottom navigation ---------- */

.mobile-nav {
  display: none;
}

.main--lesson {
  padding-top: 18px;
}

@media (max-width: 860px) {
  .mobile-nav {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 7px;
    border: 1px solid var(--line-strong);
    border-radius: 18px;
    background: rgba(var(--surface), 0.9);
    box-shadow: 0 18px 50px rgba(var(--shade), 0.2);
    backdrop-filter: blur(20px);
  }

  .mobile-nav a {
    display: grid;
    justify-items: center;
    gap: 3px;
    padding: 6px 14px;
    border-radius: 12px;
    color: var(--dim);
    font-size: 0.58rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .mobile-nav a.is-active {
    color: var(--cyan);
    background: rgba(var(--cyan-rgb), 0.07);
  }

  .mobile-nav svg {
    width: 19px;
    height: 19px;
  }

  body {
    padding-bottom: 82px;
  }
}

/* ---------- Level headings ---------- */

.level-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin: 22px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.level-head__tag {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  margin-right: 10px;
}

.level-head__meta {
  color: var(--dim);
  font-size: 0.72rem;
}

.level-head__count {
  color: var(--dim);
  font-size: 0.68rem;
  font-weight: 600;
  white-space: nowrap;
}

@media (max-width: 560px) {
  .level-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 4px;
  }

  .level-head__meta {
    display: block;
    margin-top: 3px;
  }
}

.subjects--three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

@media (max-width: 1060px) {
  .subjects--three {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 860px) {
  .subjects--three {
    grid-template-columns: 1fr;
  }
}

/* ---------- Install banner ---------- */

.install-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 26px;
  padding: 28px 30px;
  border: 1px solid rgba(var(--cyan-rgb), 0.22);
  border-radius: 24px;
  background:
    radial-gradient(600px 240px at 85% 0%, rgba(var(--cyan-rgb), 0.12), transparent 70%),
    linear-gradient(135deg, rgba(var(--surface), 0.9), rgba(var(--surface), 0.92));
  box-shadow: 0 26px 65px rgba(var(--shade), 0.1);
}

.install-banner .section__sub {
  max-width: 58ch;
}

.install-banner__actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
}

.install-banner__note {
  font-size: 0.66rem;
  color: var(--dim);
  letter-spacing: 0.04em;
  white-space: nowrap;
}

@media (max-width: 760px) {
  .install-banner {
    align-items: flex-start;
    flex-direction: column;
    padding: 22px;
  }

  .install-banner__actions {
    align-items: flex-start;
    width: 100%;
  }

  .install-banner__note {
    white-space: normal;
  }
}

.subjects--five {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

@media (max-width: 1060px) {
  .subjects--five {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 860px) {
  .subjects--five {
    grid-template-columns: 1fr;
  }
}


/* ---------- Lesson shell ---------- */

.lesson-shell {
  width: min(1220px, calc(100% - 32px));
  margin: 0 auto;
  padding: 26px 0 70px;
}

.lesson-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 18px;
}

.lesson-top__left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.lesson-back {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(var(--ink), 0.04);
  color: var(--muted);
  transition: background 0.2s ease, color 0.2s ease;
}

.lesson-back:hover {
  color: var(--text);
  background: rgba(var(--ink), 0.08);
}

.lesson-back svg {
  width: 18px;
  height: 18px;
}

.lesson-title {
  min-width: 0;
}

.lesson-title__eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--c1);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.lesson-title__name {
  font-family: var(--font-display);
  font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  letter-spacing: -0.01em;
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lesson-top__right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.xp-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 11px;
  border-radius: 999px;
  border: 1px solid rgba(var(--amber-rgb), 0.22);
  background: rgba(var(--amber-rgb), 0.07);
  color: var(--amber);
  font-size: 0.7rem;
  font-weight: 700;
}

.xp-pill svg {
  width: 14px;
  height: 14px;
}

.lesson-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.lesson-progress__bar {
  flex: 1;
  height: 5px;
  border-radius: 999px;
  background: rgba(var(--ink), 0.08);
  overflow: hidden;
}

.lesson-progress__bar span {
  display: block;
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--c1), var(--c2));
  transition: width 0.4s cubic-bezier(0.2, 0.9, 0.2, 1);
}

.lesson-progress__label {
  color: var(--dim);
  font-size: 0.68rem;
  font-weight: 600;
  white-space: nowrap;
}

.lesson-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 0.88fr);
  gap: 16px;
  align-items: stretch;
}

.stage {
  /* En el pizarrón oscuro se usan las variantes aclaradas del color de la materia. */
  --c1: var(--c1-lt, #e6d194);
  --c2: var(--c2-lt, #e6d194);
  position: relative;
  min-height: 540px;
  border: 1px solid var(--line);
  border-radius: 26px;
  overflow: hidden;
  background:
    radial-gradient(100% 100% at 0% 0%, color-mix(in srgb, var(--c1) 22%, transparent), transparent 55%),
    radial-gradient(100% 100% at 100% 100%, color-mix(in srgb, var(--c2) 18%, transparent), transparent 55%),
    linear-gradient(160deg, #0a3d35, #002f2a 60%, #00241f);
  box-shadow: var(--shadow);
  isolation: isolate;
}

.stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(var(--ink), 0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(var(--ink), 0.028) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  pointer-events: none;
  z-index: 0;
}

.stage__glow {
  position: absolute;
  width: 52%;
  aspect-ratio: 1;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.2;
  background: var(--c1);
  top: 8%;
  left: 12%;
  pointer-events: none;
}

.stage__scene {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  padding: 26px;
}

.stage__scene svg {
  width: 100%;
  height: 100%;
  max-height: 480px;
}

.stage__hint {
  position: absolute;
  left: 18px;
  bottom: 16px;
  z-index: 4;
  color: rgba(var(--ink), 0.48);
  font-size: 0.66rem;
  letter-spacing: 0.02em;
}

.stage__badge {
  position: absolute;
  top: 18px;
  left: 18px;
  z-index: 4;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--c1) 35%, transparent);
  background: rgba(var(--surface), 0.82);
  color: var(--c1);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  backdrop-filter: blur(10px);
}

.panel {
  display: flex;
  flex-direction: column;
  min-height: 540px;
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background: linear-gradient(160deg, rgba(var(--surface), 0.82), rgba(var(--surface), 0.82));
  box-shadow: var(--shadow);
}

.panel__kicker {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--c1);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.panel__title {
  font-family: var(--font-display);
  font-size: clamp(1.35rem, 2.3vw, 1.9rem);
  line-height: 1.08;
  letter-spacing: -0.01em;
}

.panel__text {
  margin-top: 14px;
  color: var(--muted);
  font-size: 0.91rem;
  line-height: 1.7;
}

.panel__text strong {
  color: var(--text);
  font-weight: 600;
}

.panel__note {
  margin-top: 14px;
  padding: 11px 13px;
  border: 1px solid rgba(var(--amber-rgb), 0.18);
  border-radius: 12px;
  background: rgba(var(--amber-rgb), 0.055);
  color: var(--amber);
  font-size: 0.76rem;
  line-height: 1.5;
}

.panel__footer {
  margin-top: auto;
  padding-top: 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.panel__footer .btn {
  flex: 1;
  min-width: 140px;
}

.panel__hint {
  color: var(--dim);
  font-size: 0.72rem;
  line-height: 1.5;
}

.panel__hint button {
  border: 0;
  background: none;
  color: var(--cyan);
  font: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ---------- Intro ---------- */

.intro-list {
  display: grid;
  gap: 9px;
  margin-top: 20px;
}

.intro-list li {
  display: flex;
  gap: 10px;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.intro-list__num {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--c1) 24%, transparent);
  color: var(--c1);
  font-family: var(--font-display);
  font-size: 0.64rem;
  font-weight: 700;
}

.speech-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 16px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(var(--ink), 0.035);
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
}

.speech-btn:hover {
  color: var(--text);
  background: rgba(var(--ink), 0.06);
}

.speech-btn.is-speaking {
  color: var(--cyan);
  border-color: rgba(var(--cyan-rgb), 0.3);
}

.speech-btn svg {
  width: 14px;
  height: 14px;
}

/* ---------- Hotspots ---------- */

.hotspot {
  position: absolute;
  z-index: 6;
  width: 26px;
  height: 26px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(var(--ink), 0.6);
  background: rgba(var(--cyan-rgb), 0.9);
  box-shadow: 0 0 0 6px rgba(var(--cyan-rgb), 0.14), 0 0 24px rgba(var(--cyan-rgb), 0.6);
  color: var(--on-accent);
  font-family: var(--font-display);
  font-size: 0.72rem;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease;
}

.hotspot::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(var(--cyan-rgb), 0.4);
  animation: hotspot-pulse 2.6s ease-out infinite;
}

.hotspot:hover {
  transform: translate(-50%, -50%) scale(1.12);
}

.hotspot.is-found {
  background: var(--lime);
  border-color: var(--lime);
  box-shadow: 0 0 0 5px rgba(var(--lime-rgb), 0.12), 0 0 22px rgba(var(--lime-rgb), 0.4);
}

.hotspot.is-found::after {
  display: none;
}

@keyframes hotspot-pulse {
  0% { transform: scale(0.85); opacity: 0.8; }
  70% { transform: scale(1.35); opacity: 0; }
  100% { opacity: 0; }
}

.spot-card {
  margin-top: 16px;
  padding: 14px;
  border: 1px solid color-mix(in srgb, var(--c1) 22%, transparent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--c1) 6%, transparent);
  animation: pop 0.3s ease both;
}

.spot-card__title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-weight: 700;
}

.spot-card__title svg {
  width: 16px;
  height: 16px;
  color: var(--c1);
}

.spot-card__text {
  margin-top: 5px;
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.55;
}

.spot-count {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  color: var(--dim);
  font-size: 0.68rem;
}

.spot-count b {
  color: var(--c1);
}

/* ---------- Timeline ---------- */

.timeline-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  padding: 10px 0 14px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(var(--ink), 0.15) transparent;
}

.timeline {
  position: relative;
  display: flex;
  gap: 12px;
  min-width: 680px;
  padding: 24px 8px 8px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  top: 42px;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c1) 45%, transparent), transparent);
}

.timeline__event {
  position: relative;
  flex: 1;
  min-width: 120px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.timeline__dot {
  position: relative;
  z-index: 1;
  width: 15px;
  height: 15px;
  display: block;
  margin: 10px auto 18px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--c1) 55%, transparent);
  background: rgb(var(--surface));
  box-shadow: 0 0 0 4px rgba(var(--cyan-rgb), 0.06);
  transition: background 0.2s ease, transform 0.2s ease;
}

.timeline__event:hover .timeline__dot,
.timeline__event.is-visited .timeline__dot {
  background: var(--c1);
  transform: scale(1.15);
}

.timeline__year {
  display: block;
  text-align: center;
  color: var(--c1);
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.timeline__title {
  display: block;
  text-align: center;
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.66rem;
  line-height: 1.3;
}

.timeline__event.is-visited .timeline__title {
  color: var(--text);
}

.timeline-detail {
  margin-top: 6px;
  padding: 14px;
  border: 1px solid color-mix(in srgb, var(--c1) 20%, transparent);
  border-radius: 14px;
  background: color-mix(in srgb, var(--c1) 5%, transparent);
  animation: pop 0.3s ease both;
}

.timeline-detail__year {
  color: var(--c1);
  font-family: var(--font-display);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.timeline-detail__title {
  margin-top: 3px;
  font-size: 0.88rem;
  font-weight: 700;
}

.timeline-detail__text {
  margin-top: 5px;
  color: var(--muted);
  font-size: 0.77rem;
  line-height: 1.55;
}

/* ---------- Sort ---------- */

.sort-board {
  position: relative;
  z-index: 2;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  align-content: start;
}

.sort-cat {
  min-height: 150px;
  padding: 12px;
  border: 1px dashed rgba(var(--ink), 0.16);
  border-radius: 16px;
  background: rgba(var(--ink), 0.025);
  transition: border-color 0.2s ease, background 0.2s ease;
}

.sort-cat.is-over {
  border-color: var(--c1);
  background: color-mix(in srgb, var(--c1) 8%, transparent);
}

.sort-cat__title {
  color: var(--text);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1.2;
}

.sort-cat__hint {
  margin-top: 3px;
  color: var(--dim);
  font-size: 0.6rem;
  line-height: 1.35;
}

.sort-cat__items {
  display: grid;
  gap: 5px;
  margin-top: 9px;
}

.sort-items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

.sort-item {
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: rgba(var(--ink), 0.05);
  color: var(--text);
  font-size: 0.72rem;
  cursor: pointer;
  transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}

.sort-item:hover {
  transform: translateY(-2px);
  border-color: var(--c1);
}

.sort-item.is-selected {
  border-color: var(--c1);
  background: color-mix(in srgb, var(--c1) 14%, transparent);
  box-shadow: 0 0 20px color-mix(in srgb, var(--c1) 16%, transparent);
}

.sort-item.is-placed {
  cursor: default;
  font-size: 0.64rem;
  padding: 6px 8px;
  border-color: transparent;
  background: rgba(var(--ink), 0.06);
}

.sort-item.is-correct {
  border-color: rgba(var(--lime-rgb), 0.5);
  background: rgba(var(--lime-rgb), 0.1);
}

.sort-item.is-wrong {
  border-color: rgba(var(--pink-rgb), 0.5);
  background: rgba(var(--pink-rgb), 0.1);
}

.sort-feedback {
  margin-top: 12px;
  color: var(--muted);
  font-size: 0.75rem;
  line-height: 1.45;
  text-align: center;
}

/* ---------- Quiz ---------- */

.quiz {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}

.quiz__progress {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}

.quiz__dot {
  height: 4px;
  flex: 1;
  border-radius: 999px;
  background: rgba(var(--ink), 0.09);
}

.quiz__dot.is-active {
  background: var(--c1);
}

.quiz__dot.is-correct {
  background: var(--lime);
}

.quiz__q {
  font-size: 0.98rem;
  font-weight: 600;
  line-height: 1.45;
}

.quiz__options {
  display: grid;
  gap: 8px;
}

.quiz-option {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(var(--ink), 0.03);
  color: var(--text);
  font: inherit;
  font-size: 0.82rem;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

.quiz-option:hover {
  border-color: color-mix(in srgb, var(--c1) 40%, transparent);
  background: rgba(var(--ink), 0.055);
  transform: translateX(2px);
}

.quiz-option__letter {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 7px;
  border: 1px solid var(--line);
  color: var(--dim);
  font-family: var(--font-display);
  font-size: 0.66rem;
  font-weight: 700;
}

.quiz-option.is-correct {
  border-color: rgba(var(--lime-rgb), 0.55);
  background: rgba(var(--lime-rgb), 0.09);
}

.quiz-option.is-wrong {
  border-color: rgba(var(--pink-rgb), 0.55);
  background: rgba(var(--pink-rgb), 0.09);
}

.quiz-option:disabled {
  cursor: default;
  transform: none;
}

.quiz-feedback {
  margin-top: 10px;
  padding: 12px;
  border-radius: 12px;
  font-size: 0.76rem;
  line-height: 1.5;
  animation: pop 0.25s ease both;
}

.quiz-feedback.is-correct {
  border: 1px solid rgba(var(--lime-rgb), 0.25);
  background: rgba(var(--lime-rgb), 0.07);
  color: var(--lime);
}

.quiz-feedback.is-wrong {
  border: 1px solid rgba(var(--pink-rgb), 0.25);
  background: rgba(var(--pink-rgb), 0.07);
  color: var(--pink);
}

/* ---------- Number line ---------- */

.numberline {
  width: 100%;
  position: relative;
  z-index: 2;
}

.numberline svg {
  width: 100%;
  height: auto;
}

.numberline__readout {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.numberline__readout small {
  font-family: var(--font-body);
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--dim);
  letter-spacing: 0.02em;
}

.numberline__controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

.num-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: rgba(var(--ink), 0.05);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}

.num-btn:hover {
  background: rgba(var(--ink), 0.1);
  transform: translateY(-2px);
}

/* ---------- Balance ---------- */

.balance {
  width: 100%;
  max-width: 600px;
  position: relative;
  z-index: 2;
}

.balance svg {
  width: 100%;
  height: auto;
}

.balance__eq {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 6px;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: -0.01em;
}

.balance__eq b {
  color: var(--c1);
}

.sim-slider {
  display: grid;
  gap: 7px;
  margin-top: 16px;
}

.sim-slider__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 0.76rem;
}

.sim-slider__head b {
  color: var(--text);
  font-family: var(--font-display);
  font-size: 0.95rem;
}

.sim-slider input[type="range"] {
  width: 100%;
  height: 5px;
  border-radius: 999px;
  background: rgba(var(--ink), 0.12);
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  outline: none;
}

.sim-slider input[type="range"]::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: var(--c1);
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--c1) 15%, transparent);
}

.sim-slider input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid #fff;
  background: var(--c1);
}

/* ---------- Graph ---------- */

.graph {
  width: 100%;
  position: relative;
  z-index: 2;
}

.graph svg {
  width: 100%;
  height: auto;
}

.graph__eq {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(var(--ink), 0.04);
  color: var(--c1);
  font-family: var(--font-display);
  font-size: 1rem;
}

/* ---------- Force ---------- */

.force {
  width: 100%;
  position: relative;
  z-index: 2;
}

.force svg {
  width: 100%;
  height: auto;
}

.force__readout {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.force__stat {
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(var(--ink), 0.03);
  text-align: center;
}

.force__stat b {
  display: block;
  font-family: var(--font-display);
  font-size: 1rem;
}

.force__stat span {
  display: block;
  margin-top: 2px;
  color: var(--dim);
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ---------- Decision ---------- */

.decision-options {
  display: grid;
  gap: 9px;
  margin-top: 16px;
}

.decision-option {
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(var(--ink), 0.03);
  text-align: left;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
}

.decision-option:hover {
  border-color: color-mix(in srgb, var(--c1) 40%, transparent);
  transform: translateX(2px);
}

.decision-option__title {
  font-size: 0.82rem;
  font-weight: 600;
}

.decision-option__detail {
  margin-top: 4px;
  color: var(--dim);
  font-size: 0.72rem;
  line-height: 1.45;
}

.decision-option.is-correct {
  border-color: rgba(var(--lime-rgb), 0.5);
  background: rgba(var(--lime-rgb), 0.08);
}

.decision-option.is-wrong {
  border-color: rgba(var(--pink-rgb), 0.5);
  background: rgba(var(--pink-rgb), 0.08);
}

/* ---------- Summary ---------- */

.summary {
  position: relative;
  z-index: 4;
  width: min(760px, 100%);
  margin: 0 auto;
  text-align: center;
  padding: 10px;
}

.summary__trophy {
  width: 92px;
  height: 92px;
  margin: 0 auto 16px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 25%, rgba(var(--amber-rgb), 0.35), rgba(var(--amber-rgb), 0.06));
  border: 1px solid rgba(var(--amber-rgb), 0.3);
  box-shadow: 0 0 60px rgba(var(--amber-rgb), 0.16);
  animation: pop 0.5s cubic-bezier(0.2, 0.9, 0.2, 1) both;
}

.summary__trophy svg {
  width: 44px;
  height: 44px;
  color: var(--amber);
}

.summary__title {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 4vw, 2.8rem);
  letter-spacing: -0.01em;
  line-height: 1;
}

.summary__text {
  max-width: 560px;
  margin: 12px auto 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.65;
}

.summary__xp {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin-top: 18px;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid rgba(var(--amber-rgb), 0.3);
  background: rgba(var(--amber-rgb), 0.08);
  color: var(--amber);
  font-size: 0.8rem;
  font-weight: 700;
}

.summary__xp svg {
  width: 15px;
  height: 15px;
}

.summary__ideas {
  display: grid;
  gap: 8px;
  max-width: 560px;
  margin: 22px auto 0;
  text-align: left;
}

.summary__idea {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(var(--ink), 0.03);
  color: var(--muted);
  font-size: 0.78rem;
  line-height: 1.5;
}

.summary__idea svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--lime);
  margin-top: 1px;
}

.summary__actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

/* ---------- Confetti ---------- */

.confetti {
  position: fixed;
  inset: 0;
  z-index: 120;
  pointer-events: none;
  width: 100%;
  height: 100%;
}

/* ---------- Responsive lesson ---------- */

@media (max-width: 980px) {
  .lesson-grid {
    grid-template-columns: 1fr;
  }

  .stage {
    min-height: 400px;
  }

  .panel {
    min-height: 0;
  }

  .panel__footer {
    margin-top: 22px;
  }
}

@media (max-width: 640px) {
  .lesson-shell {
    width: calc(100% - 20px);
    padding-top: 14px;
  }

  .lesson-top {
    align-items: flex-start;
  }

  .lesson-title__name {
    font-size: 0.98rem;
  }

  .lesson-top__right .xp-pill {
    display: none;
  }

  .stage {
    min-height: 330px;
  }

  .stage__scene {
    padding: 14px;
  }

  .panel {
    padding: 18px;
  }

  .sort-board {
    grid-template-columns: 1fr;
  }

  .sort-cat {
    min-height: 90px;
  }

  .timeline__event {
    min-width: 96px;
  }

  .force__readout {
    grid-template-columns: 1fr;
  }

  .numberline__readout {
    font-size: 1.9rem;
  }

  .summary__actions .btn {
    width: 100%;
  }
}

.sim-stage {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 54px 10px 16px;
}

.speech-btn {
  align-self: flex-start;
}

.sort-board > * {
  min-width: 0;
}

.sort-cat,
.sort-cat__hint {
  overflow-wrap: anywhere;
}

.sort-cat {
  text-align: left;
  color: inherit;
  font: inherit;
  cursor: pointer;
}

.numberline__readout small {
  margin-left: 6px;
}

@media (max-width: 860px) {
  .lesson-shell {
    padding-bottom: 120px;
  }
}

/* ---------- Fractions ---------- */

.fraction {
  width: 100%;
  max-width: 560px;
}

.fraction svg {
  width: 100%;
  height: auto;
}

.fraction-slice {
  transition: fill 0.2s ease;
}

.fraction__readout {
  display: flex;
  align-items: baseline;
  justify-content: center;
  gap: 4px;
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 700;
  color: var(--text);
}

.fraction__readout i {
  font-style: normal;
  color: var(--c1);
}

.fraction__readout small {
  margin-left: 10px;
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--dim);
}

/* ---------- Code lab ---------- */

.code-layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}

.code-board {
  position: relative;
  width: min(100%, 430px);
  border: 1px solid rgba(var(--violet-rgb), 0.3);
  border-radius: 18px;
  background:
    radial-gradient(400px 220px at 50% 0%, rgba(var(--violet-rgb), 0.12), transparent 70%),
    rgba(var(--surface), 0.82);
  box-shadow: 0 20px 50px rgba(var(--shade), 0.1);
  overflow: hidden;
}

.code-grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), 1fr);
  grid-template-rows: repeat(var(--rows), 1fr);
  width: 100%;
  height: 100%;
}

.code-cell {
  position: relative;
  border-right: 1px solid rgba(var(--ink), 0.06);
  border-bottom: 1px solid rgba(var(--ink), 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
}

.code-cell.is-wall {
  background:
    repeating-linear-gradient(45deg, rgba(var(--pink-rgb), 0.18) 0 6px, rgba(var(--pink-rgb), 0.05) 6px 12px),
    rgba(var(--pink-rgb), 0.06);
}

.code-cell.is-wall::after {
  content: '';
  position: absolute;
  inset: 18%;
  border: 1px dashed rgba(var(--pink-rgb), 0.35);
  border-radius: 6px;
}

.code-cell.is-goal {
  background: rgba(var(--lime-rgb), 0.1);
  color: var(--lime);
}

.code-cell.is-goal svg {
  width: 18px;
  height: 18px;
  opacity: 0.9;
}

.code-cell.is-trail::before {
  content: '';
  width: 18%;
  height: 18%;
  border-radius: 50%;
  background: rgba(var(--violet-rgb), 0.45);
  box-shadow: 0 0 10px rgba(var(--violet-rgb), 0.5);
}

.code-bot {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: left 0.28s ease, top 0.28s ease;
  pointer-events: none;
  z-index: 2;
}

.code-bot__body {
  position: relative;
  width: 62%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f3c9d6, #9b2247 70%);
  box-shadow: 0 0 18px rgba(var(--violet-rgb), 0.65);
  border: 1px solid rgba(var(--ink), 0.35);
}

.code-bot__body span {
  position: absolute;
  top: 38%;
  width: 15%;
  height: 18%;
  border-radius: 50%;
  background: #2a0614;
  box-shadow: 0 0 0 2px rgba(var(--ink), 0.65);
}

.code-bot__body span:first-child {
  left: 27%;
}

.code-bot__body span:last-child {
  right: 27%;
}

.code-bot__dir {
  position: absolute;
  top: 2%;
  right: 2%;
  color: var(--lime);
  transform-origin: center;
  transition: transform 0.2s ease;
  line-height: 0;
}

.code-bot__dir svg {
  width: 13px;
  height: 13px;
}

.code-legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  font-size: 0.66rem;
  color: var(--dim);
}

.code-legend__item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.code-legend__item i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.code-legend__item .is-bot {
  background: var(--violet);
}

.code-legend__item .is-flag {
  border-radius: 2px;
  background: var(--lime);
}

.code-legend__item .is-wall {
  border-radius: 2px;
  background: repeating-linear-gradient(45deg, var(--pink) 0 2px, transparent 2px 4px);
}

.code-palette {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 4px;
}

.code-cmd {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 6px;
  border: 1px solid rgba(var(--violet-rgb), 0.25);
  border-radius: 12px;
  background: rgba(var(--violet-rgb), 0.06);
  color: var(--text);
  font: inherit;
  font-size: 0.68rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
}

.code-cmd:hover:not(:disabled) {
  border-color: rgba(var(--violet-rgb), 0.55);
  background: rgba(var(--violet-rgb), 0.12);
  transform: translateY(-1px);
}

.code-cmd:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.code-program {
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(var(--ink), 0.02);
}

.code-program__head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--dim);
  font-size: 0.66rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.code-program__head b {
  color: var(--violet);
}

.code-program__list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  max-height: 120px;
  overflow-y: auto;
}

.code-block {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  border: 1px solid rgba(var(--violet-rgb), 0.3);
  border-radius: 8px;
  background: rgba(var(--violet-rgb), 0.09);
  color: var(--text);
  font: inherit;
  font-size: 0.66rem;
  cursor: pointer;
}

.code-block span {
  display: inline-grid;
  place-items: center;
  width: 15px;
  height: 15px;
  border-radius: 4px;
  background: rgba(var(--violet-rgb), 0.2);
  color: var(--violet);
  font-size: 0.58rem;
}

.code-program__empty {
  margin-top: 8px;
  color: var(--dim);
  font-size: 0.7rem;
  line-height: 1.5;
}

.code-status {
  margin-top: 9px;
  font-size: 0.7rem;
  color: var(--dim);
}

.code-status.is-error {
  color: var(--pink);
}

.code-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

@media (max-width: 640px) {
  .code-palette {
    gap: 6px;
  }

  .code-cmd {
    font-size: 0.62rem;
    padding: 9px 4px;
  }

  .code-actions {
    width: 100%;
  }

  .code-actions .btn {
    flex: 1;
  }
}


/* ---------- Voice / story mode ---------- */

.voice-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(var(--ink), 0.03);
  color: var(--muted);
  font: inherit;
  font-size: 0.66rem;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
}

.voice-toggle.is-on {
  border-color: rgba(var(--cyan-rgb), 0.4);
  background: rgba(var(--cyan-rgb), 0.1);
  color: var(--cyan);
}

.voice-toggle svg {
  width: 15px;
  height: 15px;
}

.story-waves {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 22px;
  margin-top: 10px;
}

.story-waves span {
  width: 3px;
  height: 8px;
  border-radius: 99px;
  background: var(--c1, var(--cyan));
  opacity: 0.6;
  animation: storyWave 1.1s ease-in-out infinite;
}

.story-waves span:nth-child(2) {
  animation-delay: 0.12s;
}

.story-waves span:nth-child(3) {
  animation-delay: 0.24s;
}

.story-waves span:nth-child(4) {
  animation-delay: 0.36s;
}

.story-waves span:nth-child(5) {
  animation-delay: 0.48s;
}

@keyframes storyWave {
  0%, 100% { height: 6px; opacity: 0.45; }
  50% { height: 20px; opacity: 0.9; }
}

.story-text {
  margin: 12px 0 14px;
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.7;
}

.story-text p {
  margin: 0 0 9px;
}

.story-text p:first-child::first-letter {
  float: left;
  margin: 2px 7px 0 0;
  font-family: var(--font-display);
  font-size: 2.6rem;
  line-height: 0.8;
  color: var(--c1);
}

.story-question {
  margin: 16px 0 10px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 1.02rem;
  font-weight: 700;
  line-height: 1.35;
}

.story-options {
  display: grid;
  gap: 7px;
}

.story-option {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(var(--ink), 0.025);
  color: var(--text);
  font: inherit;
  font-size: 0.78rem;
  line-height: 1.45;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.18s, background 0.18s, transform 0.15s;
}

.story-option:hover:not(:disabled) {
  border-color: rgba(var(--cyan-rgb), 0.35);
  background: rgba(var(--cyan-rgb), 0.055);
  transform: translateX(2px);
}

.story-option:disabled {
  cursor: default;
}

.story-option__num {
  flex: 0 0 auto;
  display: inline-grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border-radius: 7px;
  background: rgba(var(--ink), 0.06);
  color: var(--dim);
  font-family: var(--font-display);
  font-size: 0.62rem;
  font-weight: 700;
}

.story-option.is-correct {
  border-color: rgba(var(--lime-rgb), 0.5);
  background: rgba(var(--lime-rgb), 0.08);
}

.story-option.is-wrong {
  border-color: rgba(var(--pink-rgb), 0.5);
  background: rgba(var(--pink-rgb), 0.08);
}

.story-option.is-correct .story-option__num {
  background: rgba(var(--lime-rgb), 0.2);
  color: var(--lime);
}

.story-option.is-wrong .story-option__num {
  background: rgba(var(--pink-rgb), 0.2);
  color: var(--pink);
}

@media (max-width: 640px) {
  .voice-toggle span {
    display: none;
  }

  .voice-toggle {
    padding: 8px;
  }

  .story-text {
    font-size: 0.82rem;
  }
}


/* ---------- Reto rápido ---------- */

.challenge-start {
  max-width: 760px;
  margin: 20px auto 40px;
  padding: 44px 34px;
  text-align: center;
  border: 1px solid rgba(var(--amber-rgb), 0.22);
  border-radius: 28px;
  background:
    radial-gradient(600px 260px at 50% 0%, rgba(var(--amber-rgb), 0.14), transparent 70%),
    linear-gradient(150deg, rgba(var(--surface), 0.92), rgba(var(--surface), 0.95));
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.challenge-start::after {
  content: '';
  position: absolute;
  inset: auto -20% -70% -20%;
  height: 60%;
  background: radial-gradient(ellipse, rgba(var(--violet-rgb), 0.18), transparent 70%);
  pointer-events: none;
}

.challenge-start__visual {
  width: 88px;
  height: 88px;
  margin: 0 auto 16px;
  display: grid;
  place-items: center;
  border-radius: 26px;
  color: var(--amber);
  background: rgba(var(--amber-rgb), 0.1);
  border: 1px solid rgba(var(--amber-rgb), 0.3);
  box-shadow: 0 0 36px rgba(var(--amber-rgb), 0.18);
}

.challenge-start__title {
  margin: 10px 0 12px;
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.6rem);
  line-height: 1.02;
  letter-spacing: -0.01em;
}

.challenge-start__lead {
  max-width: 540px;
  margin: 0 auto;
  color: var(--muted);
  font-size: 0.94rem;
  line-height: 1.7;
}

.challenge-start__rules {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin: 20px 0 22px;
}

.challenge-start__rules span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 0.7rem;
  background: rgba(var(--ink), 0.03);
}

.challenge-start__best {
  margin-top: 16px;
  color: var(--dim);
  font-size: 0.7rem;
}

.challenge-start__best strong {
  color: var(--amber);
}

.challenge-start__note {
  margin-top: 10px;
  color: var(--dim);
  font-size: 0.64rem;
}

.challenge-game {
  max-width: 880px;
  margin: 0 auto 40px;
}

.challenge-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 0.74rem;
}

.challenge-bar b {
  color: var(--text);
}

.challenge-bar__timer {
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(var(--amber-rgb), 0.1);
  border: 1px solid rgba(var(--amber-rgb), 0.25);
  color: var(--amber);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.9rem;
}

.challenge-bar__score {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--amber);
}

.challenge-progress {
  height: 5px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(var(--ink), 0.07);
  margin-bottom: 16px;
}

.challenge-progress span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--amber), var(--lime));
  transition: width 0.3s ease;
}

.challenge-question {
  padding: 26px;
  border: 1px solid var(--line);
  border-radius: 26px;
  background:
    radial-gradient(600px 260px at 80% -10%, color-mix(in srgb, var(--c1) 12%, transparent), transparent 70%),
    var(--panel);
  box-shadow: var(--shadow);
}

.challenge-question__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dim);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.challenge-question__icon {
  display: inline-grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 9px;
  color: var(--c1);
  background: color-mix(in srgb, var(--c1) 12%, transparent);
}
