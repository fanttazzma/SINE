.challenge-option.is-wrong {

.challenge-feedback.is-correct strong {

.challenge-feedback.is-wrong strong {
  color: var(--pink);

  function tint(hex, amount = 0.5) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const mix = (c) => Math.round(c + (255 - c) * amount);
    const [r, g, b] = [mix(n >> 16), mix(n >> 8 & 255), mix(n & 255)];
    return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
  }

    const root2 = document.getElementById("modal-root");

    root2.appendChild(wrap);
    const close = () => {
      wrap.classList.remove("is-open");
      setTimeout(() => wrap.remove(), 260);
    };
    wrap.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", close));
    wrap.addEventListener("click", (e) => {
      if (e.target === wrap) close();

      btn.textContent = action.label;
      btn.addEventListener("click", () => {

        if (result !== false) close();

    });

    return { close, element: wrap };
  }

    const pieces = Array.from({ length: 140 }, () => ({

        p.vy += 0.32;
        p.vx *= 0.992;
        p.rot += p.vr;
        p.life -= 8e-3;

  function graphStage(step) {

    const x2 = xMax;

      const y = 55 + i / 5 * 285;

    }
    for (let xVal = 0; xVal <= xMax; xVal += 2) {
      labels += `<text x="${px(xVal)}" y="356" fill="rgba(255,255,255,.38)" font-size="9" text-anchor="middle" font-family="Noto Sans, sans-serif">${xVal}</text>`;

    <div class="graph" style="padding:0 16px">
      <svg viewBox="0 0 600 390" aria-label="Gr\xE1fica de una funci\xF3n lineal">

        ${labels}
        <path d="M70 340V55M70 340h460" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <path id="graph-line" d="M${px(x1)} ${py(y1)} L${px(x2)} ${py(y2)}" stroke="#e6d194" stroke-width="4" stroke-linecap="round"/>
        <circle cx="${px(x1)}" cy="${py(y1)}" r="5" fill="#9fd3b8"/>

          <rect x="0" y="0" width="94" height="56" rx="10" fill="#133f39" stroke="rgba(230,209,148,.4)"/>
          <circle cx="20" cy="64" r="12" fill="#0a2421" stroke="#e6d194" stroke-width="3"/>

  function answer(index) {
    if (!challenge || challenge.finished || challenge.answered) return;
    challenge.answered = true;
    const q = challenge.questions[challenge.index];
    const correct = index === q.correct;
    const feedback = document.getElementById("challenge-feedback");
    const buttons = root.querySelectorAll(".challenge-option");
    buttons.forEach((button, i) => {
      button.disabled = true;
      if (i === q.correct) button.classList.add("is-correct");
      if (i === index && !correct) button.classList.add("is-wrong");
      if (i === index) button.classList.add("is-picked");
    });
    if (correct) {
      challenge.correct += 1;
      challenge.streak += 1;
      challenge.score += 10 + (challenge.streak >= 3 ? 2 : 0);
      playCorrect();
      if (feedback) {
        feedback.className = "challenge-feedback is-correct";
        feedback.innerHTML = `<strong>\xA1Correcto!</strong> ${escapeHTML(q.explain)}`;
      }
    } else {
      challenge.streak = 0;
      playWrong();
      if (feedback) {
        feedback.className = "challenge-feedback is-wrong";
        feedback.innerHTML = `<strong>No era esa.</strong> ${escapeHTML(q.explain)}`;
      }
    }
    const scoreEl = document.getElementById("challenge-score");
    if (scoreEl) scoreEl.textContent = challenge.score;
    clearTimeout(nextTimer);
    nextTimer = setTimeout(() => {
      if (!challenge || challenge.finished) return;
      challenge.index += 1;
      if (challenge.index >= TOTAL) finish("complete");
      else renderQuestion();
    }, 900);
  }

    const lessons = LESSONS.filter((l) => l.gradeId === grade.id && l.subject === subjectKey);

    return `<div class="crumbs"><a href="#/">Inicio</a>${icon("chevronRight")}<a href="#/grado/${grade.id}">${escapeHTML(grade.name)}</a>${icon("chevronRight")}<span>${escapeHTML(s.name)}</span></div>
    <section class="subject-hero" style="--c1:${s.color};--c2:${s.color2}">
      <div class="subject-hero__icon">${subjectIcon(subjectKey)}</div>
      <div class="grade-hero__label">${escapeHTML(grade.name)} \xB7 ${lessons.length} misiones</div>
      <h1 class="subject-hero__title">${escapeHTML(s.name)}</h1>
      <p class="subject-hero__desc">${escapeHTML(s.blurb)}</p>
      <div class="subject-card__bottom" style="max-width:420px">
        <div class="bar"><span style="width:${p.pct}%"></span></div>
        <span class="subject-card__pct">${p.done}/${p.total} \xB7 ${p.pct}%</span>
      </div>
    </section>

    <section class="section" style="margin-top:32px">
      <div class="section__head">
        <div>
          <span class="section__eyebrow">Misiones</span>
          <h2 class="section__title">Elige una misi\xF3n</h2>
          <p class="section__sub">Cada una dura entre 8 y 15 minutos y se guarda en tu cuaderno.</p>
        </div>
        <span class="pill">${p.done}/${p.total} completadas</span>
      </div>
      <div class="lesson-list">
        ${lessons.map((l, idx) => lessonRow(l, idx + 1)).join("")}
      </div>
    </section>`;
  }
  function notebookView() {
    const user = getState();
    const total = getTotalProgress();
    const level = getLevel();
    const last = getLastLesson();
    const badges = getBadgeCards(user);
    return `<div class="crumbs"><a href="#/">Inicio</a>${icon("chevronRight")}<span>Mi cuaderno</span></div>
    <section class="profile-card">
      <div class="profile-card__avatar">${escapeHTML((user.name || "E").charAt(0).toUpperCase())}</div>
      <div>
        <div class="grade-hero__label">Tu cuaderno de descubrimientos</div>
        <h1 class="profile-card__name">${escapeHTML(user.name)}</h1>
        <p class="profile-card__sub">Nivel ${level.level} \xB7 ${user.xp} XP \xB7 ${total.done} de ${total.total} misiones completadas</p>
        <button class="btn btn--ghost btn--small" data-action="edit-name" style="margin-top:12px">${icon("pencil", 14)} Cambiar nombre</button>
      </div>
      <div class="profile-stats">
        <div class="profile-stat"><b>${user.xp}</b><span>XP</span></div>
        <div class="profile-stat"><b>${getStreak()}</b><span>Racha</span></div>
        <div class="profile-stat"><b>${total.done}</b><span>Misiones</span></div>
      </div>
    </section>

    <div class="notebook-grid">
      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title">Progreso por materia</h2>
          <span class="pill">${total.pct}% total</span>
        </div>
        <div class="progress-list">
          ${Object.entries(SUBJECTS).map(([key, s]) => {
      const p = getSubjectProgressGlobal(key);
      return `<div class="progress-item" style="--c1:${s.color};--c2:${s.color2}">
                <span class="progress-item__icon">${subjectIcon(key)}</span>
                <div>
                  <div class="progress-item__name">${escapeHTML(s.name)}</div>
                  <div class="progress-item__bar"><span style="width:${p.pct}%"></span></div>
                </div>
                <span class="progress-item__pct">${p.done}/${p.total}</span>
              </div>`;
    }).join("")}
        </div>
        <div class="notebook-actions">
          ${last ? `<a class="btn btn--primary btn--small" href="#/leccion/${last.id}">${icon("play", 14)} Continuar: ${escapeHTML(last.title)}</a>` : `<a class="btn btn--primary btn--small" href="#/grado/p1">${icon("play", 14)} Empezar mi primera misi\xF3n</a>`}
          <button class="btn btn--ghost btn--small" data-action="reset">${icon("refresh", 14)} Reiniciar progreso</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title">Logros</h2>
          <a class="link-arrow" href="#/logros">Ver todos ${icon("arrowRight", 14)}</a>
        </div>
        <div class="badges">
          ${badges.slice(0, 6).join("")}
        </div>
        <div style="margin-top:16px;padding:14px;border:1px solid rgba(var(--cyan-rgb),.16);border-radius:14px;background:rgba(var(--cyan-rgb),.045)">
          <div style="font-size:.72rem;font-weight:700;color:var(--cyan);display:flex;gap:7px;align-items:center">${icon("sparkles", 14)} Luci dice</div>
          <p style="margin-top:5px;color:var(--muted);font-size:.74rem;line-height:1.55">Completa una misi\xF3n de cada materia y la constancia de explorador ser\xE1 tuya. No hay prisa: aprender es un camino, no una carrera.</p>
        </div>
      </div>
    </div>

    <section class="section" style="margin-top:26px">
      <div class="section__head">
        <div>
          <span class="section__eyebrow">Siguiente paso</span>
          <h2 class="section__title">Misiones que te faltan</h2>
        </div>
      </div>
      <div class="lesson-list">
        ${LESSONS.filter((l) => !isLessonDone(l.id)).slice(0, 4).map((l, idx) => lessonRow(l, idx + 1)).join("") || `<div class="empty">\xA1Completaste todas las misiones! Eres oficialmente un explorador del SINE.</div>`}
      </div>
    </section>`;
  }
  function getBadgeCards(user) {
    return BADGES.map((b) => {
      const on = user.badges?.includes(b.id);
      return `<div class="badge-card ${on ? "is-unlocked" : ""}">
      <div class="badge-card__icon">${badgeIcon(b.icon)}</div>
      <div><div class="badge-card__name">${b.name}</div><div class="badge-card__desc">${on ? b.desc : "Bloqueado"}</div></div>
    </div>`;
    });
  }
  function achievementsView() {
    const user = getState();
    const total = getTotalProgress();
    return `<div class="crumbs"><a href="#/">Inicio</a>${icon("chevronRight")}<span>Logros</span></div>
    <section class="grade-hero" data-big="" style="--c1:#a57f2c;--c2:#9b2247">
      <div>
        <div class="grade-hero__label">Colecci\xF3n de logros</div>
        <h1 class="grade-hero__title">Cada misi\xF3n deja huella</h1>
        <p class="grade-hero__desc">Has completado ${total.done} de ${total.total} misiones. Los logros se desbloquean solos y viven en tu cuaderno local.</p>
      </div>
      <div class="progress-ring" style="--value:${total.pct};--c1:#a57f2c">
        <div class="progress-ring__text"><div class="progress-ring__num">${total.pct}%</div><div class="progress-ring__label">avance</div></div>
      </div>
    </section>
    <section class="section" style="margin-top:32px">
      <div class="section__head">
        <div><span class="section__eyebrow">Tu colecci\xF3n</span><h2 class="section__title">${user.badges?.length || 0} de ${BADGES.length} logros</h2></div>
      </div>
      <div class="badges" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${getBadgeCards(user).join("")}
      </div>
    </section>`;
  }
  function notFoundView(message = "No encontramos esa p\xE1gina.") {
    return `<section class="card" style="padding:60px 30px;text-align:center">
    <div style="font-size:3rem;margin-bottom:10px">\u{1F331}</div>
    <h1 style="font-family:var(--font-display);font-size:2rem;letter-spacing:-.04em">Te perdiste en la selva</h1>
    <p style="color:var(--muted);margin-top:10px">${escapeHTML(message)}</p>
    <a class="btn btn--primary" href="#/" style="margin-top:22px">${icon("home", 16)} Volver al inicio</a>
  </section>`;
  }
  function editNameModal() {
    const user = getState();
    openModal({
      title: "\xBFC\xF3mo te llamas?",
      body: `<p class="modal__text">Tu nombre se queda en este dispositivo. No se env\xEDa a ning\xFAn servidor.</p>
      <div class="field"><label for="name-input">Nombre o apodo</label><input id="name-input" maxlength="24" value="${escapeHTML(user.name)}" autocomplete="off" /></div>`,
      actions: [
        { label: "Cancelar", className: "btn--ghost" },
        {
          label: "Guardar",
          className: "btn--primary",
          onClick: () => {
            const value = document.getElementById("name-input")?.value;
            setName(value);
            toast("Nombre actualizado");
            render();
          }
        }
      ]
    });
    setTimeout(() => document.getElementById("name-input")?.focus(), 80);
  }
  function resetModal() {
    openModal({
      title: "Reiniciar progreso",
      body: `<p class="modal__text">Se borrar\xE1n las misiones completadas, el XP, la racha y los logros de este dispositivo. Esta acci\xF3n no se puede deshacer.</p>`,
      actions: [
        { label: "Cancelar", className: "btn--ghost" },
        {
          label: "S\xED, reiniciar",
          className: "btn--danger",
          onClick: () => {
            resetProgress();
            toast("Progreso reiniciado");
            render();
          }
        }
      ]
    });
  }
  function installModal() {
    if (window.matchMedia?.("(display-mode: standalone)").matches) {
      openModal({
        title: "SINE ya est\xE1 instalado",
        body: `<p class="modal__text">Est\xE1s usando la versi\xF3n instalada. Puedes abrirla desde tu pantalla de inicio o men\xFA de aplicaciones, incluso sin internet.</p>`,
        actions: [{ label: "Genial", className: "btn--primary" }]
      });
      return;
    }
    if (deferredInstallPrompt) {
      openModal({
        title: "Instalar SINE",
        body: `<p class="modal__text">El SINE se instalar\xE1 como una app en este dispositivo. Despu\xE9s podr\xE1s abrirla sin conexi\xF3n, como cualquier otra aplicaci\xF3n.</p>
        <div class="panel__note" style="margin-top:14px"><strong>Ocupa muy poco:</strong> contenido, voz y progreso viven en tu dispositivo.</div>`,
        actions: [
          { label: "Ahora no", className: "btn--ghost" },
          {
            label: "Instalar ahora",
            className: "btn--primary",
            onClick: async () => {
              const prompt = deferredInstallPrompt;
              deferredInstallPrompt = null;
              try {
                await prompt.prompt();
                await prompt.userChoice;
              } catch {
              }
            }
          }
        ]
      });
      return;
    }
    openModal({
      title: "Lleva el SINE contigo",
      body: `<p class="modal__text">Puedes instalarla como app o copiar la carpeta para usarla sin internet.</p>
      <div class="install-steps">
        <div><b>Android / Chrome</b><span>Men\xFA \u22EE \u2192 \u201CInstalar aplicaci\xF3n\u201D o \u201CAgregar a pantalla principal\u201D.</span></div>
        <div><b>iPhone / iPad</b><span>Compartir \u2192 \u201CAgregar a inicio\u201D.</span></div>
        <div><b>Windows / Mac</b><span>Icono de instalar en la barra de direcciones, o abre <code>start.bat</code> / <code>start.sh</code>.</span></div>
        <div><b>Sin instalaci\xF3n</b><span>Descomprime <code>SINE-offline.zip</code> y abre <code>index.html</code> o el servidor local.</span></div>
      </div>
      <p class="modal__text" style="margin-top:14px"><strong>Para distribuir:</strong> comparte la carpeta <code>dist/</code>, el ZIP portable o publica la carpeta en GitHub Pages/Netlify. Todo funciona sin backend.</p>`,
      actions: [{ label: "Entendido", className: "btn--primary" }]
    });
  }
  function aboutModal() {
    openModal({
      title: "Acerca del SINE",
      body: `<p class="modal__text"><strong>SINE</strong> (Sistema Integral de Nivelaci\xF3n Educativa) es un prototipo de enciclopedia interactiva offline para secundaria. Cada misi\xF3n combina una explicaci\xF3n breve, una interacci\xF3n y un reto con retroalimentaci\xF3n.</p>
      <p class="modal__text" style="margin-top:12px">Est\xE1 inspirado en las enciclopedias interactivas de los 90, pero dise\xF1ado para tres realidades de Chiapas: conectividad intermitente, escuelas multigrado y diversidad cultural.</p>
      <div class="panel__note" style="margin-top:16px"><strong>Contenido:</strong> alineaci\xF3n conceptual al Plan de Estudios 2022 de la SEP, con ejemplos de Chiapas. Es un demo: antes de usarlo en aula debe revisarse con docentes y contrastarse con los libros de texto oficiales.</div>
      <p class="modal__text" style="margin-top:12px"><strong>Fuentes recomendadas para la siguiente iteraci\xF3n:</strong> SEP (planes y programas), INEGI (censo y territorio), CONEVAL (pobreza), INPI (pueblos ind\xEDgenas) y Secretar\xEDa de Salud de Chiapas.</p>
      <p class="modal__text" style="margin-top:12px"><strong>Privacidad:</strong> no hay cuentas, servidores ni analytics. El progreso se guarda solo en este dispositivo con <code>localStorage</code>.</p>`,
      actions: [{ label: "Entendido", className: "btn--primary" }]
    });
  }
  function bindTilt() {
    if (window.matchMedia("(hover: none)").matches) return;
    document.querySelectorAll("[data-tilt]").forEach((card) => {
      card.addEventListener("pointermove", (e) => {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `perspective(900px) rotateX(${(-y * 5).toFixed(2)}deg) rotateY(${(x * 6).toFixed(2)}deg) translateY(-4px)`;
      });
      card.addEventListener("pointerleave", () => {
        card.style.transform = "";
      });
    });
  }
  function handleAction(action) {
    if (action === "sound") {
      const nowMuted = toggleMute();
      const btn = document.querySelector('[data-action="sound"]');
      if (btn) {
        btn.innerHTML = icon(nowMuted ? "mute" : "volume");
        btn.setAttribute("aria-label", nowMuted ? "Activar sonido" : "Silenciar");
      }
      toast(nowMuted ? "Sonido silenciado" : "Sonido activado");
      return;
    }
    if (action === "scroll-grades") {
      document.getElementById("grados")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (action === "edit-name") {
      editNameModal();
      return;
    }
    if (action === "reset") {
      resetModal();
      return;
    }
    if (action === "about") {
      aboutModal();
      return;
    }
    if (action === "install") {
      installModal();
      return;
    }
  }
  function render() {
    stopConfetti();
    currentCleanup?.();
    currentCleanup = null;
    stopSpeaking();
    const route = parseRoute();
    let content = "";
    let full = false;
    if (route.name === "home") content = homeView();
    else if (route.name === "grade") content = gradeView(route.gradeId);
    else if (route.name === "subject") content = subjectView(route.gradeId, route.subject);
    else if (route.name === "notebook") content = notebookView();
    else if (route.name === "achievements") content = achievementsView();
    else if (route.name === "challenge") content = renderChallengePage();
    else if (route.name === "lesson") {
      content = renderLessonPage(route.id);
      full = true;
    } else content = notFoundView();
    app.innerHTML = shell(content, route, { full });
    if (route.name === "lesson" && content) {
      currentCleanup = mountLesson(route.id) || null;
    }
    if (route.name === "challenge" && content) {
      currentCleanup = mountChallenge() || null;
    }
    bindTilt();
    if (route.name !== "lesson") window.scrollTo(0, 0);
    document.title = route.name === "home" ? "SINE \xB7 Aprende sin se\xF1al" : route.name === "lesson" ? `${getLesson(route.id)?.title || "Misi\xF3n"} \xB7 SINE` : route.name === "grade" ? `${GRADES.find((g) => g.id === route.gradeId)?.name || "Grado"} \xB7 SINE` : route.name === "subject" ? `${SUBJECTS[route.subject]?.name || "Materia"} \xB7 SINE` : route.name === "challenge" ? "Reto r\xE1pido \xB7 SINE" : route.name === "notebook" ? "Mi cuaderno \xB7 SINE" : "Logros \xB7 SINE";
  }
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (btn) {
      e.preventDefault();
      handleAction(btn.dataset.action);
    }
  });
  window.addEventListener("hashchange", render);
  touchVisit();
  initStars();
  render();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
      });
    });
  }
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.querySelector(".modal.is-open [data-close]")?.click();
    }
    if (e.key.toLowerCase() === "s" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
      handleAction("sound");
    }
  });
  function refreshShell() {
  }
  function getRoute() {
    return parseRoute();
  }
})();

  </script>
  </body>
</html>
